<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f5f2;
        --ink: #1f1a17;
        --accent: #c85a3f;
        --muted: #6d625c;
        --card: #ffffff;
      }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at 20% 10%, #fff3e6 0%, transparent 35%),
          radial-gradient(circle at 80% 0%, #f4d9c6 0%, transparent 40%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .wrap {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid #e7ddd6;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        border-radius: 18px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 16px;
        letter-spacing: 0.5px;
        font-weight: 700;
      }
      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        font-weight: 600;
      }
      input,
      textarea {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid #d6c7be;
        border-radius: 10px;
        background: #fff;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      button {
        font: inherit;
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 12px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(200, 90, 63, 0.3);
      }
      #status {
        margin-top: 8px;
        color: var(--muted);
        min-height: 22px;
      }
      .list {
        margin-top: 24px;
      }
      .item {
        padding: 14px 16px;
        border: 1px solid #efe5de;
        border-radius: 12px;
        background: #fff8f3;
        margin-bottom: 12px;
        animation: fadeIn 0.35s ease both;
      }
      .item strong {
        display: block;
        margin-bottom: 6px;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Mini Feedback Forum</h1>
      <p class="lead">
        Leave a message and it will appear in the list right away.
      </p>

      <form id="feedback-form">
        <div>
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Olena"
            required
          />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Write your feedback..."
            required
          ></textarea>
        </div>
        <button type="submit">Send</button>
        <div id="status" aria-live="polite"></div>
      </form>

      <section class="list">
        <h2>All feedback</h2>
        <div id="feedback-list"></div>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
